[plugin]
id = "subnautica_player"
name = "深海迷航 & 零度之下 陪玩"
version = "1.0.0"
type = "plugin"
entry = "plugin.plugins.subnautica_player:SubnauticaPlayerPlugin"
description = "让 N.E.K.O 亲自玩《深海迷航》与《深海迷航：零度之下》：主人先手动打开游戏并进入存档，猫娘会截屏判断、主动说明计划、自主探索/采集/制造/建造并尝试推进主线；玩家随时可以碰键接手，或让她停手。"
short_description = "Catgirl plays Subnautica / Below Zero: sees the screen, plans out loud, explores and crafts."
keywords = [
    "深海迷航", "深海", "美丽水世界", "subnautica", "subnautica1",
    "零度之下", "深海迷航零度之下", "belowzero", "below zero", "subnautica zero",
    "去玩", "开始玩", "陪我玩", "帮我玩", "你来玩", "你玩", "代打", "探索",
    "生存", "氧气", "上浮", "下潜", "海底", "基地", "建造", "制造", "扫描",
    "海蛾号", "海卡车", "海虾号", "独眼巨人号", "极光号", "利维坦",
    "别再玩", "别玩了", "停手", "停下", "暂停", "我来", "我接手", "让我来",
    "继续", "接着玩", "你继续", "交给你", "接着打",
    "往前走", "往右走", "往左走", "后退", "上浮", "下潜", "按e", "扫描", "拾取",
    "现在在干嘛", "打到哪", "什么情况", "看到什么", "检查一下", "计划",
    "play", "autoplay", "autopilot", "take over", "stop",
]

[plugin.author]
name = "呆萌貔貅"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
# Enabling the plugin must not hijack the keyboard.  The player (or the
# dialog LLM) calls subnautica_play.  auto_start=false is manual-start, not
# "disabled": tools and entries still load.
auto_start = false

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用指南"
entry = "docs/quickstart.md"
permissions = ["state:read"]

# ---------------------------------------------------------------------------
# Plugin configuration.
#
# This table is named [subnautica], not [subnautica_player]: a table whose
# name equals the plugin id is migrated into the distribution profile, while
# any other top-level table stays in plugin.toml and is what
# plugin.config.dump() returns.
# ---------------------------------------------------------------------------
[subnautica]
# auto | dxgi | gdi | pil.  dxgi sees exclusive fullscreen; GDI/Pillow are the
# windowed fallbacks.  A failing backend is quarantined and the next one tried.
capture_backend = "auto"
capture_monitor = 0

# A minimised Unity window is parked near (-32000, -32000) with an icon-sized
# rectangle; cropping to it yields a 1x1 "bright" frame.  Reject it explicitly.
min_capture_edge = 160

# Capture/analysis cadence.  3 fps is enough for exploration; commands run
# immediately and are sliced into 100 ms holds.
target_fps = 3.0
frame_max_edge_px = 1152
frame_jpeg_quality = 72
# Raw JPEG byte budget per pushed frame (base64 adds ~33% on the wire).
frame_max_bytes = 120000
stream_frames_to_llm = true
frame_stream_interval_seconds = 10.0

# Proactive "what I see / what I will do" turns.  Each one is a real LLM turn,
# so keep it comfortable.
commentary_interval_seconds = 30.0
urgent_cooldown_seconds = 24.0
problem_cooldown_seconds = 60.0

# Refuse to inject input unless the game window is the foreground window.
require_foreground = true

# false = enabling the plugin does not start playing.  subnautica_play does.
autopilot_enabled = false
autopilot_tick_seconds = 0.35

# true = observe and narrate only; never press a key.  Good for the first run.
dry_run = false

# Hard stop so an unattended session cannot run forever.
max_session_minutes = 90.0

# Consecutive all-black frames before refusing to press keys.
blind_frame_limit = 8

# Subnautica hides the cursor during first-person play; a visible cursor means
# menu/PDA/fabricator.  We never auto-click "New Game" and default to not
# pressing Escape in a menu, because a pause menu can belong to the player.
auto_resume_from_menu = false
menu_stable_ticks = 3

# Refuse to inject until the catgirl has actually seen gameplay (two frames
# with the cursor hidden and no dark UI), so she cannot start a new save by
# mashing keys in the main menu.
start_in_game_required = true

# Surface when the underwater timer exceeds this, even if the HUD rings are
# not recognised.  Base oxygen is 45 s; leaving 17 s of reserve is deliberate.
oxygen_safe_seconds = 28.0

# Mouse-look calibration.  Subnautica uses Unity mouse deltas; the default is
# a conservative starting point.  If turns overshoot, raise units per degree;
# if they undershoot, lower it.  Closed-loop aim accepts a rough value.
look_units_per_degree = 13.0
horizontal_fov = 70.0
vertical_fov = 45.0
invert_y = false

# "Jump in and play together": if the player presses movement/use/E/Tab keys
# the plugin releases everything and watches.  After this idle time it resumes,
# unless the player used F9 (hard pause) or said "stop".
yield_on_human_input = true
human_input_grace_seconds = 12.0
pause_hotkey_enabled = true

# Default objective; subnautica_play(objective=...) overrides it.
objective = ""
plan_steps = []

# Per-key overrides.  Keys use the same names as input.py (w/a/s/d/space/c/e/
# tab/mouse1/mouse2...).  Example: forward = "w".
[subnautica.keys]
